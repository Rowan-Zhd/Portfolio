<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found · Rawan Zahreddine</title>
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/assets/favicon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0A; color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300; -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 40px; text-align: center;
    }
    .glow {
      position: fixed; top: -30%; left: 50%; transform: translateX(-50%);
      width: 640px; height: 640px; pointer-events: none;
      background: radial-gradient(circle, rgba(201,169,110,0.08), transparent 70%);
    }
    .wrap { position: relative; max-width: 480px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 14px;
      font-size: 10.5px; letter-spacing: 4px; text-transform: uppercase;
      color: #C9A96E; margin-bottom: 24px;
    }
    .eyebrow::before { content: ''; width: 36px; height: 1px; background: #C9A96E; }
    .code {
      font-family: 'Times New Roman', Georgia, serif;
      font-size: clamp(88px, 18vw, 140px); font-weight: 300; line-height: 0.9;
      letter-spacing: -3px; color: #FFFFFF; margin-bottom: 20px;
    }
    .msg {
      font-size: 15px; line-height: 1.7; color: #9A9A9A;
      margin-bottom: 40px; font-weight: 300;
    }
    .msg strong { color: #C0C0C0; font-weight: 400; }
    .home {
      display: inline-block; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
      color: #C9A96E; text-decoration: none;
      padding: 14px 28px; border: 1px solid rgba(201,169,110,0.5); border-radius: 2px;
      transition: all 0.25s ease;
    }
    .home:hover { background: #C9A96E; color: #0A0A0A; border-color: #C9A96E; }
    .home:focus-visible { outline: 1px solid rgba(201,169,110,0.6); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow">Error 404</div>
    <div class="code">404</div>
    <p class="msg">This page could not be found. It may have moved or never existed. Let&rsquo;s get you back to <strong>the work</strong>.</p>
    <a class="home" href="/">Back to home &rarr;</a>
  </div>
</body>
</html>
